apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-kubernetes
  namespace: prod-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-kubernetes
  template:
    metadata:
      labels:
        app: hello-kubernetes
    spec:
      containers:
        - name: hello-kubernetes
          image: paulbouwer/hello-kubernetes:1.10.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"    # 10% d'un vCPU
              memory: "64Mi" # 64 Mebibytes
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
                    lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]